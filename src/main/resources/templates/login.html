<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP System | Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-card">
    <h1>ISP Management System</h1>
    <p class="subtitle">Sign in to your account</p>

    <div class="message error" th:if="${param.error}">
        Incorrect email or password, or your account is inactive.
    </div>
    <div class="message success" th:if="${param.logout}">
        You have been logged out.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Email</label>
        <input id="username" type="email" name="username" placeholder="name@example.com" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Log in</button>
    </form>
    <p class="note">Demo account: admin@isp.com</p>
</div>
</body>
</html>
